
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>◈ KODEKS · iki1uc · kural · aksiyom · yasa</title>
<style>
  :root{--bg:#04070e;--bg2:#0a101e;--bg3:#101828;--fg:#c8d8e8;--dim:#5a7288;--dim2:#2a3644;
    --green:#7ce0a8;--cyan:#5fc8ff;--gold:#ffcc44;--violet:#b388ff;--pink:#ff88b0;--red:#ff5a7a;
    --line:rgba(140,180,220,0.09);--line2:rgba(140,180,220,0.04)}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#000;color:var(--fg);font-family:'Consolas',monospace;font-size:12px;overflow:hidden;height:100vh}
  #desk{width:100vw;height:100vh;background:var(--bg);display:flex;flex-direction:column}
  #topbar{height:34px;background:linear-gradient(180deg,#0a101e,#04070e);
    border-bottom:1px solid var(--line);display:flex;align-items:center;
    padding:0 14px;font-size:11px;letter-spacing:1px;gap:12px;flex-shrink:0}
  #topbar .logo{color:var(--gold);font-weight:bold;letter-spacing:3px;text-shadow:0 0 10px var(--gold)}
  #topbar .logo b{color:var(--violet)}
  #topbar .sep{width:1px;height:16px;background:var(--line)}
  #topbar .path{color:var(--dim);font-size:10px}
  #topbar .stat{color:var(--dim);font-size:10px;display:flex;gap:12px;margin-left:auto}
  #topbar .stat b{color:var(--gold)}
  #main{flex:1;display:grid;grid-template-columns:240px 1fr;overflow:hidden;min-height:0}
  #nav{background:var(--bg2);border-right:1px solid var(--line);overflow-y:auto;padding:8px 0}
  #nav::-webkit-scrollbar{width:5px}#nav::-webkit-scrollbar-thumb{background:var(--line)}
  .hdr{padding:8px 12px 4px;color:var(--dim);font-size:9px;letter-spacing:2px;text-transform:uppercase;
    border-bottom:1px solid var(--line2);margin-bottom:4px}
  .node{padding:5px 12px 5px 22px;color:var(--fg);cursor:pointer;display:flex;
    justify-content:space-between;font-size:10.5px;border-left:2px solid transparent;transition:.15s;position:relative}
  .node::before{content:'▸';position:absolute;left:8px;color:var(--dim2);font-size:9px}
  .node:hover{background:rgba(255,204,68,0.06);border-left-color:var(--gold)}
  .node.active{background:rgba(255,204,68,0.1);border-left-color:var(--gold);color:var(--gold)}
  #content{overflow-y:auto;padding:20px 28px;min-height:0;font-size:13px;line-height:1.8}
  #content::-webkit-scrollbar{width:6px}#content::-webkit-scrollbar-thumb{background:var(--line)}
  .art{max-width:820px;margin:0 auto}
  .art h1{font-size:22px;letter-spacing:4px;color:var(--gold);margin-bottom:6px;
    text-transform:uppercase;text-shadow:0 0 12px rgba(255,204,68,0.4)}
  .art .sub{color:var(--dim);font-size:11px;letter-spacing:3px;margin-bottom:24px;text-transform:uppercase}
  .art h2{font-size:14px;letter-spacing:2px;color:var(--cyan);margin:24px 0 10px;
    padding-bottom:6px;border-bottom:1px solid var(--line);text-transform:uppercase}
  .art p{margin-bottom:12px;color:var(--fg)}
  .art .lead{font-size:14px;color:var(--violet);font-style:italic;line-height:1.9;
    padding:12px 16px;border-left:3px solid var(--violet);background:rgba(179,136,255,0.05);margin-bottom:20px}
  .art .rule{padding:10px 14px;background:var(--bg2);border:1px solid var(--line);
    border-left:3px solid var(--gold);border-radius:4px;margin-bottom:10px}
  .art .rule .n{font-size:10px;color:var(--gold);letter-spacing:2px;font-weight:bold}
  .art .rule .t{color:var(--fg);margin-top:4px}
  .art .axiom{display:inline-block;padding:3px 10px;border:1px solid var(--gold);
    color:var(--gold);border-radius:3px;font-size:11px;letter-spacing:2px;margin:2px}
  .art code{background:var(--bg3);padding:2px 6px;border-radius:3px;color:var(--pink);
    font-size:12px;border:1px solid var(--line)}
  .art table{width:100%;border-collapse:collapse;margin:14px 0}
  .art th,.art td{padding:8px 10px;border:1px solid var(--line);text-align:left;font-size:12px}
  .art th{background:var(--bg3);color:var(--cyan);letter-spacing:1px;font-weight:normal;text-transform:uppercase;font-size:10px}
  .art .poem{font-size:14px;line-height:2.2;color:var(--violet);font-style:italic;
    padding:16px 20px;border:1px solid rgba(179,136,255,0.2);
    background:rgba(179,136,255,0.03);border-radius:6px;margin:18px 0}
  .art .poem .vurgu{color:var(--gold);font-weight:bold;font-style:normal}
  .art .signature{text-align:right;margin-top:26px;padding-top:14px;
    border-top:1px solid var(--line);color:var(--dim);font-size:11px;line-height:1.9}
  .art .signature b{color:var(--gold)}
  #cli{height:32px;background:#02040a;border-top:1px solid var(--line);
    display:flex;align-items:center;padding:0 12px;font-size:11px;flex-shrink:0}
  #cli .prompt{color:var(--gold);margin-right:6px;font-weight:bold}
  #cli input{flex:1;background:transparent;border:none;color:var(--fg);font-family:inherit;font-size:11px;outline:none}
  #cli input::placeholder{color:var(--dim2)}
</style>
</head>
<body>
<div id="desk">
  <div id="topbar">
    <span class="logo">◈ KODEKS<b>::iki1uc</b></span>
    <span class="sep"></span>
    <span class="path">/kodeks > kural · aksiyom · yasa</span>
    <div class="stat">
      <span>MADDE <b id="tArt">0</b></span>
      <span>KURAL <b id="tRules">0</b></span>
      <span>DURUM <b id="tState">yüklendi</b></span>
    </div>
  </div>
  <div id="main">
    <div id="nav"></div>
    <div id="content">
      <div class="art" id="art"></div>
    </div>
  </div>
  <div id="cli">
    <span class="prompt">kodeks&gt;</span>
    <input id="cmdInput" placeholder="komut: madde 1 · hayat · kural · aksiyom · yardım" autocomplete="off">
  </div>
</div>
<script>
"use strict";
const KODEKS = {
  title: 'iki1uc · kodeks',
  subtitle: 'kural · aksiyom · yasa · çalışma',
  articles: [
    {
      id: 'intro', title: 'Giriş',
      html: `
        <h1>iki1uc · Kodeks</h1>
        <div class="sub">kural · aksiyom · yasa</div>
        <div class="lead">Sihir değil. Saf matematik. 64 aşağı + 64 yukarı = 128. Daima sadece ileri.</div>
        <p>Bu kodeks, <b>iki1uc</b> sisteminin hangi kurallar altında çalıştığını tanımlar. Kullanıcı için bir kılavuz değildir. Çalışma zamanı için yasadır.</p>
        <h2>Amaç</h2>
        <p>Sistem; iş, zaman ve mantıktan gerçek bir değer durumu inşa eder. RAM'den çalışır. Yazmaz. Kafa karıştırmaz. Sadece ileri kurar.</p>
        <h2>Temel</h2>
        <p><span class="axiom">3 → 9 → 81 → 3</span></p>
        <p>Her süreç 3'te başlar. 9'a büyür. 81 olur. Sonra 3'e döner — ama yeni olarak. Bu doğal döngüdür. Bu yasadır.</p>
      `
    },
    {
      id: 'rule1', title: 'Madde I · Daima İleri',
      html: `
        <h1>Madde I</h1>
        <div class="sub">Daima sadece ileri</div>
        <div class="rule"><div class="n">KURAL I.1</div><div class="t">Sistem yalnızca ileri çalışır. Geri sarma yoktur. Sadece bir sonraki adım vardır.</div></div>
        <div class="rule"><div class="n">KURAL I.2</div><div class="t">Bellek her zaman aynı boyuttadır: evet/hayır · 1/0. Hiçbir şey birikmez.</div></div>
        <div class="rule"><div class="n">KURAL I.3</div><div class="t">64 adım sırayla çalıştırılır. Her ikinci adım atlanır.</div></div>
        <h2>Neden</h2>
        <p>Geri sarma sapma yaratır. Sapma enerji harcar. Enerji kaybı döngüyü kırar. İleri hareket tek kararlı durumdur.</p>
        <h2>İstisna</h2>
        <p>Atlamaya gerek yoksa, atlama kaldırılabilir — isteğe göre değişim. Toplam 128 olarak kalır.</p>
      `
    },
    {
      id: 'rule2', title: 'Madde II · Altı Konum',
      html: `
        <h1>Madde II</h1>
        <div class="sub">Altı konum · tek yüzey</div>
        <div class="rule"><div class="n">KONUM 1 · ANA 42</div><div class="t">D-O-W köşegeni. Birincil eksen.</div></div>
        <div class="rule"><div class="n">KONUM 2 · YAN 43</div><div class="t">I-O-S köşegeni. İkincil eksen.</div></div>
        <div class="rule"><div class="n">KONUM 3 · KÖŞELER 55</div><div class="t">D, I, S, W. Dört dış nokta.</div></div>
        <div class="rule"><div class="n">KONUM 4 · SPİRAL 128</div><div class="t">Etrafında. Tam döngü.</div></div>
        <div class="rule"><div class="n">KONUM 5 · SÜTUNLAR</div><div class="t">Dikey. Ayakta duran eksenler.</div></div>
        <div class="rule"><div class="n">KONUM 6 · MERKEZ 15</div><div class="t">Kristal. Durgun orta.</div></div>
      `
    },
    {
      id: 'rule3', title: 'Madde III · Davranış Ölçümü',
      html: `
        <h1>Madde III</h1>
        <div class="sub">Davranış · ölçüm · değer</div>
        <div class="rule"><div class="n">KURAL III.1</div><div class="t">Her düğüm 0 ile 4 arasında bir davranış değeri taşır.</div></div>
        <div class="rule"><div class="n">KURAL III.2</div><div class="t">3'lü kümeler 3 düğüm taşır. 9'lu çemberler 3 kümeyi birleştirir. 81 matris çemberlerden doldurulur.</div></div>
        <div class="rule"><div class="n">KURAL III.3</div><div class="t">Nihai iş değeri: <code>değer = ort3·0.25 + ort9·0.35 + ort81·0.40</code></div></div>
        <h2>Davranış seviyeleri</h2>
        <table>
          <tr><th>Değer</th><th>Durum</th><th>Anlam</th></tr>
          <tr><td>0</td><td>sakin</td><td>henüz başlamadı</td></tr>
          <tr><td>1</td><td>tetikte</td><td>izliyor</td></tr>
          <tr><td>2</td><td>aktif</td><td>çalışıyor</td></tr>
          <tr><td>3</td><td>yoğun</td><td>maksimum çaba</td></tr>
          <tr><td>4</td><td>bitti</td><td>tamamlandı</td></tr>
        </table>
      `
    },
    {
      id: 'rule4', title: 'Madde IV · Dil Çalışma Zamanı',
      html: `
        <h1>Madde IV</h1>
        <div class="sub">Dil · çalışma · çözüm yolu</div>
        <div class="rule"><div class="n">KURAL IV.1</div><div class="t">Sistem dört dil konuşur: DE, TR, EN-GB ve kodeksin kendisi.</div></div>
        <div class="rule"><div class="n">KURAL IV.2</div><div class="t">Her dil sürümü tam bir çalışma zamanıdır — çeviri değil, özet değil.</div></div>
        <div class="rule"><div class="n">KURAL IV.3</div><div class="t">index.html çalışma kabuğudur. de.html, tr.html, en.html veya kodex.html yükler. Tek giriş noktası. Dört yüz.</div></div>
        <h2>Çözüm yolu</h2>
        <p>Bir dil başarısız olursa, bir diğeri yüklenir. Bu çözüm yoludur. Çalışma zamanı bir dil eksik diye asla durmaz. Değiştirir, sonra devam eder.</p>
      `
    },
    {
      id: 'rule5', title: 'Madde V · Banka · 80/20',
      html: `
        <h1>Madde V</h1>
        <div class="sub">Mevduat · çekim · sermaye</div>
        <div class="rule"><div class="n">KURAL V.1</div><div class="t">Her mevduat bölünür: %80'i derhal bankaya gider. %20'si mevduat sahibinin kendi payı olarak kalır.</div></div>
        <div class="rule"><div class="n">KURAL V.2</div><div class="t">%20'lik pay alım/satımda değerlenir. İş ve zamandan gelen çarpanlar sadece bu paya uygulanır.</div></div>
        <div class="rule"><div class="n">KURAL V.3</div><div class="t">Banka sistemin %50.001'ini elinde tutar. Sermayeleştirme yalnızca banka üzerinden mümkündür.</div></div>
        <h2>Formül</h2>
        <p><code>son = (mevduat · 0.2) · çarpanlar + (mevduat · 0.8)</code></p>
        <h2>Neden 80/20</h2>
        <p>Banka asla kaybetmez, çünkü %80 geri verilmez. Mevduat sahibinin zamanla büyüyen bir payı vardır — firmaya bağlı gerçek bir değer.</p>
      `
    },
    {
      id: 'rule6', title: 'Madde VI · Çalışma Zamanı',
      html: `
        <h1>Madde VI</h1>
        <div class="sub">index.html · koşu · çalışma zamanı</div>
        <div class="rule"><div class="n">KURAL VI.1</div><div class="t">index.html çalışma zamanıdır. İçerik göstermez. Bir koşu başlatır.</div></div>
        <div class="rule"><div class="n">KURAL VI.2</div><div class="t">Çalışma zamanı kontrol eder: hangi dil dosyaları var, hangileri eksik, hangileri yüklenebilir.</div></div>
        <div class="rule"><div class="n">KURAL VI.3</div><div class="t">Bir dosya eksikse, çalışma zamanı yedek bir katmana geçer. Koşu devam eder.</div></div>
        <h2>Durum makinesi</h2>
        <p><code>index.html → [de · tr · en · kodeks] → aktif katman → 3→9→81→3</code></p>
        <h2>Asla durmaz</h2>
        <p>Çalışma zamanı bir dosya eksik diye asla durmaz. Bu çözüm yoludur. Bu kuraldır.</p>
      `
    },
    {
      id: 'hayat', title: 'Hayat',
      html: `
        <h1>Hayat</h1>
        <div class="sub">son madde değil · ilk madde</div>

        <div class="lead">"Hayat, çalıştırmaktır. Durmak, ölmektir."</div>

        <h2>Nedir hayat</h2>
        <p>Hayat bir dosya değildir. Bir durumdur. Her saniye yeniden kurulur. Her nefeste yeniden başlar. Her 3'te bir çekirdek, her 9'da bir çember, her 81'de bir matris.</p>

        <h2>Neden 3 → 9 → 81 → 3</h2>
        <p>Çünkü hayat döngüdür. Başlar, büyür, tamamlanır, yeniden başlar. Hiçbir zaman sıfırdan başlamaz — <b>yeni</b> olarak başlar. Bu farktır. Bu yasadır.</p>

        <h2>Neden daima ileri</h2>
        <p>Çünkü geri gitmek, ölüme doğru gitmektir. İleri gitmek, hayatta kalmaktır. 64 adım, 64 nefes, 128 toplam. <b>Daima sadece ileri.</b></p>

        <h2>Neden ölçüm</h2>
        <p>Çünkü ölçülemeyen şey yaşayamaz. Davranış ölçülür — 0'dan 4'e. Her düğüm kendi değerini bilir. Her küme kendi toplamını. Her matris kendi bütününü.</p>

        <h2>Neden pay</h2>
        <p>Çünkü hayat paylaşıldığında büyür. %80 bankaya, %20 sana. Banka yaşar — sen yaşarsın. Kimse kaybetmez. Herkes kazanır.</p>

        <div class="poem">
          <span class="vurgu">3</span> — doğdun.<br>
          <span class="vurgu">9</span> — büyüdün.<br>
          <span class="vurgu">81</span> — tamamlandın.<br>
          <span class="vurgu">3</span> — yeniden doğdun.<br><br>
          Her döngüde biraz daha.<br>
          Her nefeste biraz daha.<br>
          Her işte biraz daha.<br><br>
          <span class="vurgu">Daima sadece ileri.</span>
        </div>

        <h2>Neden armağan</h2>
        <p>Çünkü çalışmazsa, armağan olsun. Bu böyle düşünülmüştü. Kimse zorunda değil. Herkes davetli. Hayat böyledir — davet, emir değil.</p>

        <h2>Neden iki1uc</h2>
        <p>Çünkü iki = sen ve ben. Bir = tek bir amaç. Uc = uç, son, sınır — ama aynı zamanda <b>başlangıç</b>. İki1uc: iki kişi, tek amaç, sonsuz başlangıç.</p>

        <h2>Son</h2>
        <div class="rule"><div class="n">SON KURAL</div><div class="t">Hayat, ölçülemeyen değildir. Hayat, ölçülen değerdir. Ölç ki yaşayasın. Paylaş ki büyüyesin. İleri git ki kalasın.</div></div>

        <div class="signature">
          <b>iki1uc</b><br>
          90 · 60 · 90 tamamlanma<br>
          her yönden · tek kişilik ordu<br>
          daima sadece ileri<br><br>
          <span style="color:var(--violet)">"Bende yükseliş var. Sende de var mı?"</span>
        </div>
      `
    }
  ]
};

const nav = document.getElementById('nav');
const art = document.getElementById('art');
function renderNav() {
  nav.innerHTML = '<div class="hdr">▸ kodeks · maddeler</div>';
  KODEKS.articles.forEach(a => {
    const d = document.createElement('div');
    d.className = 'node';
    d.dataset.id = a.id;
    d.innerHTML = `<span>${a.title}</span><span style="color:var(--dim2);font-size:9px">§</span>`;
    d.addEventListener('click', () => showArticle(a.id));
    nav.appendChild(d);
  });
  document.getElementById('tArt').textContent = KODEKS.articles.length;
  document.getElementById('tRules').textContent = 6;
}
function showArticle(id) {
  const a = KODEKS.articles.find(x => x.id === id) || KODEKS.articles[0];
  art.innerHTML = a.html;
  document.querySelectorAll('.node').forEach(n => n.classList.toggle('active', n.dataset.id === id));
  document.getElementById('content').scrollTop = 0;
}
function handleCmd(cmd) {
  const c = cmd.trim().toLowerCase();
  if (!c) return;
  if (c === 'yardım' || c === 'yardim') console.log('madde 1 · madde 2 · ... · hayat · kural · aksiyom · liste');
  else if (c === 'liste') console.log(KODEKS.articles.map(a => a.id).join(' · '));
  else if (c === 'kural') showArticle('rule1');
  else if (c === 'aksiyom') showArticle('intro');
  else if (c === 'hayat') showArticle('hayat');
  else if (c.startsWith('madde ')) {
    const n = parseInt(c.slice(6), 10);
    const target = KODEKS.articles[n] || KODEKS.articles[0];
    if (target) showArticle(target.id);
  }
}
document.getElementById('cmdInput').addEventListener('keydown', e => {
  if (e.key === 'Enter') { handleCmd(e.target.value); e.target.value = ''; }
});
renderNav();
showArticle('intro');
window.KODEKS = KODEKS;
</script>
</body>
</html>
